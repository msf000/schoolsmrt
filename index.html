
<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#4f46e5" />
    <meta name="description" content="نظام متابعة الطلاب الذكي - تسجيل حضور، درجات، وتقارير" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>نظام المدرس الذكي</title>
    <!-- Tailwind CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              sans: ['Tajawal', 'sans-serif'],
            },
            colors: {
              primary: '#4f46e5', // indigo-600
              secondary: '#0f766e', // teal-700
              accent: '#f59e0b', // amber-500
            },
            animation: {
                'fade-in': 'fadeIn 0.4s ease-out',
                'slide-in-right': 'slideInRight 0.3s ease-out',
                'slide-up': 'slideUp 0.4s ease-out',
                'bounce-in': 'bounceIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275)',
                'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
            },
            keyframes: {
                fadeIn: {
                    '0%': { opacity: '0' },
                    '100%': { opacity: '1' },
                },
                slideInRight: {
                    '0%': { transform: 'translateX(100%)', opacity: '0' },
                    '100%': { transform: 'translateX(0)', opacity: '1' },
                },
                slideUp: {
                    '0%': { transform: 'translateY(20px)', opacity: '0' },
                    '100%': { transform: 'translateY(0)', opacity: '1' },
                },
                bounceIn: {
                    '0%': { transform: 'scale(0.8)', opacity: '0' },
                    '100%': { transform: 'scale(1)', opacity: '1' },
                }
            }
          }
        }
      }
    </script>
    <style>
        html, body {
            height: 100%;
            overflow: hidden; /* Prevent body scroll, handle inside App */
            background-color: #f9fafb;
            -webkit-tap-highlight-color: transparent;
        }
        
        /* Custom scrollbar for better aesthetics */
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: rgba(0,0,0,0.05); 
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #cbd5e1; 
            border-radius: 10px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #94a3b8; 
        }

        /* Initial Loading Spinner */
        #root:empty {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: #f9fafb;
        }
        #root:empty::after {
            content: '';
            width: 50px;
            height: 50px;
            border: 4px solid #e2e8f0;
            border-top-color: #4f46e5;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* --- PRINT STYLES --- */
        @media print {
            body { 
                overflow: visible !important; 
                height: auto !important; 
                background: white !important;
                color: black !important;
            }
            #root { 
                height: auto !important; 
                overflow: visible !important; 
            }
            
            /* Hide Navigation and Buttons */
            aside, header, nav, button, .no-print, input[type="file"], .fixed-overlay {
                display: none !important;
            }
            
            /* Expand Content */
            main {
                margin: 0 !important;
                padding: 0 !important;
                width: 100% !important;
                height: auto !important;
                overflow: visible !important;
            }

            /* Ensure Colors Print */
            * {
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
            }

            /* Table Styling for Print */
            table {
                width: 100% !important;
                border-collapse: collapse !important;
                font-size: 12px;
            }
            th, td {
                border: 1px solid #000 !important;
                padding: 4px !important;
            }
            
            /* Break Page logic */
            .break-before { page-break-before: always; }
            .break-inside-avoid { page-break-inside: avoid; }
            .break-after-page { page-break-after: always; }
        }
    </style>
<script type="importmap">
{

    "lucide-react": "https://aistudiocdn.com/lucide-react@^0.292.0",
    "react-markdown": "https://aistudiocdn.com/react-markdown@^9.0.1",
    "remark-gfm": "https://aistudiocdn.com/remark-gfm@^4.0.0",
    "xlsx": "https://aistudiocdn.com/xlsx@^0.18.5",
    "@supabase/supabase-js": "https://aistudiocdn.com/@supabase/supabase-js@^2.39.0",
    "vite": "https://aistudiocdn.com/vite@^5.0.8",
    "@vitejs/plugin-react": "https://aistudiocdn.com/@vitejs/plugin-react@^4.2.1",
    "virtual:pwa-register": "https://aistudiocdn.com/vite-plugin-pwa@^0.19.0",
    "vite-plugin-pwa": "https://esm.sh/vite-plugin-pwa@^1.2.0"
  }
}
</script>
</head>
  <body class="bg-gray-50 text-gray-900 font-sans antialiased">
    <div id="root" class="h-full w-full"></div>

  </body>
</html>
